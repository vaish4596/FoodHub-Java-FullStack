<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Delivery - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
    url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1400&q=80");
    background-size:cover;
    background-position:center;
}

.login-box{
    width:380px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    font-size:45px;
}

h2{
    text-align:center;
    color:#ff6b00;
    margin-top:10px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
    font-size:15px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#444;
}

.input-group input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    transition:.3s;
}

.input-group input:focus{
    outline:none;
    border-color:#ff6b00;
    box-shadow:0 0 8px rgba(255,107,0,.3);
}

.remember{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
    color:#555;
    font-size:14px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#ff6b00;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
    font-weight:bold;
}

button:hover{
    background:#e65c00;
    transform:translateY(-2px);
}

.google-btn{
    display:block;
    width:100%;
    margin-top:14px;
    padding:12px;
    text-align:center;
    border-radius:10px;
    border:1px solid #ddd;
    background:white;
    color:#333;
    text-decoration:none;
    font-weight:bold;
}

.google-btn:hover{
    background:#f7f7f7;
}

.extra{
    text-align:center;
    margin-top:20px;
    color:#666;
}

.extra a{
    color:#ff6b00;
    text-decoration:none;
    font-weight:bold;
}

.extra a:hover{
    text-decoration:underline;
}

.message{
    padding:10px 12px;
    border-radius:8px;
    margin-bottom:16px;
    font-size:14px;
}

.message.error{
    background:#ffe8e8;
    color:#b00020;
}

.message.info{
    background:#e8f4ff;
    color:#0b5394;
}
</style>

</head>
<body>

<div class="login-box">

    <div class="logo">🍔🍕</div>

    <h2>Food Delivery</h2>
    <p class="subtitle">Fresh food delivered to your doorstep</p>

    <div id="loginMessage" class="message" style="display:none;"></div>

    <form action="login" method="post" id="loginForm">

        <input type="hidden" name="returnUrl" id="returnUrl" value="">

        <div class="input-group">
            <label>Username or Email</label>
            <input type="text" name="name" id="username" placeholder="Enter username or email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
        </div>

        <label class="remember">
            <input type="checkbox" name="rememberMe" id="rememberMe">
            Remember Me
        </label>

        <button type="submit">Login</button>

    </form>

    <a href="googleLogin" class="google-btn">Login with Google</a>

    <div class="extra">
        New to Food Delivery?
        <a href="register.html">Create Account</a>
    </div>

</div>

<script>

function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? decodeURIComponent(match[2]) : "";
}

const messageBox = document.getElementById("loginMessage");
const loginRequired = getQueryParam("loginRequired");
const error = getQueryParam("error");
const returnUrl = getQueryParam("returnUrl");

if (returnUrl) {
    document.getElementById("returnUrl").value = returnUrl;
}

if (loginRequired === "1") {
    messageBox.textContent = "Please log in to add items to your cart.";
    messageBox.className = "message info";
    messageBox.style.display = "block";
} else if (error === "password" || error === "username") {
    messageBox.textContent = "Invalid username or password.";
    messageBox.className = "message error";
    messageBox.style.display = "block";
} else if (error && error.indexOf("google") === 0) {
    messageBox.textContent = "Google sign-in failed or is not configured yet.";
    messageBox.className = "message error";
    messageBox.style.display = "block";
}

const rememberedEmail = getCookie("foodhub_remember_email");
if (rememberedEmail) {
    document.getElementById("username").value = rememberedEmail;
    document.getElementById("rememberMe").checked = true;
}

</script>

</body>
</html>
